[project]
name = "bound-ppt-backend"
version = "0.1.0"
description = "Bound PPT backend — FastAPI, in-process jobs, SSE, ingestion, generation and export"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "python-pptx>=1.0.2",
  "reportlab>=4.2.0",
  "pdfplumber>=0.11.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "markdown-it-py>=3.0.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "pillow>=11.0.0",
  "nh3>=0.2.18",
  "boto3>=1.35.0",
  "structlog>=24.4.0",
  "uuid6>=2024.7.10",
  "pwdlib[argon2]>=0.2.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
